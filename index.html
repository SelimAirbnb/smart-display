<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Airbnb Smart Display</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  color:white;
  overflow:hidden;

  background: linear-gradient(270deg, #0f2027,#203a43,#4e54c8,#8f94fb);
  background-size: 600% 600%;
  animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.main {
  display:flex;
  justify-content:space-between;
  align-items:center;
  height:100vh;
  padding:80px;
}

.left { max-width:60%; }

h1{
  font-size:90px;
  margin:0;
  opacity:0;
  transform:translateY(40px);
  animation:welcomeIn 1.5s ease forwards;
  text-shadow:0 0 20px rgba(255,255,255,0.15);
}

@keyframes welcomeIn{
  to{opacity:1; transform:translateY(0);}
}

.wave {
  display:inline-block;
  animation:waveAnim 2s infinite;
  transform-origin:70% 70%;
}

@keyframes waveAnim {
  0%{transform:rotate(0);}
  15%{transform:rotate(15deg);}
  30%{transform:rotate(-10deg);}
  45%{transform:rotate(15deg);}
  60%{transform:rotate(-5deg);}
  75%{transform:rotate(10deg);}
  100%{transform:rotate(0);}
}

#weather {
  font-size:35px;
  margin-top:20px;
}

.right { text-align:center; }

.card {
  background: rgba(255,255,255,0.08);
  padding:30px;
  border-radius:20px;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

#info{
  margin-top:20px;
  font-size:18px;
  line-height:1.6;
  opacity:0;
  animation:fadeInfo 1.5s ease forwards;
  animation-delay:0.5s;
}

#info div{
  cursor:pointer;
  transition:all 0.3s;
}

#info div:hover{
  transform:translateX(5px);
  color:#00ffcc;
}

@keyframes fadeInfo{ to{opacity:1;} }

/* clock */
#clockBox {
  position:fixed;
  top:30px;
  right:50px;
  padding:15px 25px;
  border-radius:15px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
}

.time{ font-size:48px; }
.date{ font-size:14px; opacity:0.6; }

#menu {
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:15px;
  margin-top:25px;
}

.menuItem {
  background: rgba(255,255,255,0.08);
  border-radius:18px;
  padding:15px;

  text-align:center;
  cursor:pointer;

  backdrop-filter: blur(10px);

  transition: all 0.3s ease;
}

.menuItem:hover {
  transform: translateY(-5px) scale(1.05);
  background: rgba(255,255,255,0.15);
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.menuItem .icon {
  font-size:28px;
  margin-bottom:8px;
}

.menuItem .label {
  font-size:14px;
  opacity:0.8;
  letter-spacing:0.5px;
}

#weather {
  opacity: 0.8;
  font-size:28px;

}

#bigWeather {
  font-size:120px;
  text-align:center;
  margin-top:40px;
}

#bg {
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:-1;
}

.bgImage {
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;

  opacity:0;
  transition: opacity 2s ease, transform 10s ease;
}

/* aktif image */
.bgImage.active {
  opacity:1;
  transform: scale(1.1); /* hafif zoom 💣 */
}
#overlay {
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;

  background: radial-gradient(
    circle at 35% 50%,  /* sol tarafa odak */
    rgba(0,0,0,0.2) 45%,
    rgba(0,0,0,0.5) 60%,
    rgba(0,0,0,0.8) 100%
  );

  backdrop-filter: blur(2px);
  z-index:0;

  animation: overlayMove 20s ease infinite;
}

@keyframes overlayMove {
  0% { opacity:0.9; }
  50% { opacity:0.7; }
  100% { opacity:0.9; }
}
#bg {
  z-index: -1;  /* en arka */
}

#overlay {
  z-index: 0;   /* arka plan üstü */
}

.main {
  position:relative;
  z-index: 3;   /* içerik */
}

#clockBox {
  z-index: 4;   /* en üst */
}


@keyframes overlayMove {
  0% { filter: brightness(1); }
  50% { filter: brightness(1.05); }
  100% { filter: brightness(1); }
}
.infoItem {
  margin-bottom:15px;
  text-align:center;
}

.infoItem img {
  margin-top:5px;
  border-radius:10px;
}


</style>
</head>

<body>
<div id="bg"></div>
<div id="overlay"></div>

<div id="clockBox"><div id="clock"></div></div>

<div class="main">

  <div class="left">
    <h1 id="guest">Loading...</h1>
    
  </div>

  <div class="right">
    <div class="card">
      <div style="margin-bottom:15px;font-size:20px;">📶 WiFi Access</div>
      <img id="qr" width="180">
      <div id="info"></div>
    </div>
  </div>

<div id="menu">

<div class="menuItem" onclick="goPage(2)">
  <div class="icon">🍔</div>
  <div class="label">Restaurant</div>
</div>

<div class="menuItem" onclick="goPage(2)">
  <div class="icon">🛒</div>
  <div class="label">Market</div>
</div>

<div class="menuItem" onclick="goPage(2)">
  <div class="icon">☕</div>
  <div class="label">Café</div>
</div>

<div class="menuItem" onclick="goPage(3)">
  <div class="icon">🌦️</div>
  <div class="label">Weather</div>
</div>



<div id="menu">
  ...
</div>

<div class="page" id="page3">
  <h1 id="bigWeather"></h1>
</div>

</div>

<script>

// ✅ FIREBASE
const firebaseConfig={
  apiKey:"AIzaSyBz_Z5jDY78SmlcRzc93IuKpD8rP8Izmc4",
  authDomain:"selim-c52a8.firebaseapp.com",
  databaseURL:"https://selim-c52a8-default-rtdb.firebaseio.com",
  projectId:"selim-c52a8"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

// ✅ CLOCK
setInterval(()=>{
  let now=new Date();
  let time=now.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  let date=now.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});

  document.getElementById("clock").innerHTML=
    `<div class="time">${time}</div>
     <div class="date">${date}</div>`;
},1000);

// ✅ FIREBASE DATA
db.ref("/").on("value",snap=>{
  let d=snap.val();
  if(!d) return;

  // ✅ INFO PANEL
let infoHtml = `
<div class="infoItem">
  <div>📍 ${d.market || "Supermarkt"}</div>
  ${d.marketLink ? makeMapQR(d.marketLink) : ""}
</div>

<div class="infoItem">
  <div>🍔 ${d.restaurant || "Restaurant"}</div>
  ${d.restaurantLink ? makeMapQR(d.restaurantLink) : ""}
</div>

<div class="infoItem">
  <div>☕ ${d.cafe || "Café"}</div>
  ${d.cafeLink ? makeMapQR(d.cafeLink) : ""}
</div>

<div class="infoItem">
  🚕 ${d.taxi || "Taxi"}
</div>

<div class="infoItem">
  🏥 ${d.emergency || "Notfall"}
</div>
`;

document.getElementById("info").innerHTML = infoHtml;


  // ✅ WELCOME
  document.getElementById("guest").innerHTML=
    "Welcome "+d.guestName+" <span class='wave'>👋</span>";

  let g=document.getElementById("guest");
  g.style.animation="none";
  g.offsetHeight;
  g.style.animation="welcomeIn 1.5s ease forwards";

  makeQR(d.wifiName,d.wifiPass);
  getWeather();
});

// ✅ QR
function makeQR(name,pass){
  let data=`WIFI:S:${name};T:WPA;P:${pass};;`;

  document.getElementById("qr").src=
    "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+
    encodeURIComponent(data);
}

// ✅ WEATHER
function getWeather(){

  fetch("https://api.open-meteo.com/v1/forecast?latitude=47.86&longitude=12.13&current_weather=true")
    .then(r => r.json())
    .then(data => {

      let temp = Math.round(data.current_weather.temperature); // ✅ tek değer

      let icon = "☀️";

      // ✅ büyük (weather page)
      document.getElementById("bigWeather").innerText =
        icon + " " + temp + "°C";

    });
}
``

// ✅ MAP OPEN
function openMap(link){
  if(link) window.open(link,"_blank");
}

function goPage(id){

  document.querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

  document.getElementById("page" + id)
    .classList.add("active");
}

const images = [
  "https://images.unsplash.com/photo-1564501049412-61c2a3083791",
  "https://images.unsplash.com/photo-1506744038136-46273834b3fb",
  "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
];


let bgIndex = 0;

function changeBackground(){

  const bg = document.getElementById("bg");

  // yeni image oluştur
  let img = document.createElement("img");
  img.src = images[bgIndex];
  img.classList.add("bgImage");

  bg.appendChild(img);

  // küçük delay sonra aktif yap
  setTimeout(()=>{
    img.classList.add("active");
  }, 100);

  // eski image sil
  if(bg.children.length > 2){
    bg.removeChild(bg.children[0]);
  }

  bgIndex = (bgIndex + 1) % images.length;
}

setInterval(changeBackground, 8000);

changeBackground();


function makeMapQR(link){
  return `
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(link)}">
  `;
}

</script>

</body>
</html>
